
services:
  db:
    image: postgres:16-alpine
    container_name: tasks_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasks_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasks_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tasks_db?schema=public
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: sh -c "npx prisma db push && npm run start:dev"
    networks:
      - tasks_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tasks_frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tasks_network

  nginx:
    image: nginx:alpine
    container_name: tasks_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - tasks_network

volumes:
  postgres_data:

networks:
  tasks_network:
    driver: bridge

